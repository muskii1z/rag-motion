<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-motion</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c1f24; --muted: #5d6573; --border: #e1e4ea;
    --accent: #2f6fed; --accent-soft: #e8efff; --good: #1f8a4c; --good-soft: #e3f4ea;
    --warn: #a86400; --warn-soft: #fdf1dc; --bad: #b3261e; --bad-soft: #fbe4e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --text: #e7e9ee; --muted: #9aa3b2; --border: #2b3039;
      --accent: #7aa2ff; --accent-soft: #1f2a44; --good: #5cc98a; --good-soft: #17301f;
      --warn: #f0b04a; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1a18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 11px 14px; font-size: 15px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .examples { margin: 10px 0 24px; display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button { background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    font-weight: 400; padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .full { background: var(--good-soft); color: var(--good); }
  .partial { background: var(--warn-soft); color: var(--warn); }
  .none { background: var(--bad-soft); color: var(--bad); }
  .answer { white-space: pre-wrap; margin-top: 10px; }
  .cite { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; background: var(--accent-soft);
    color: var(--accent); cursor: pointer; text-decoration: none; }
  .gaps { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); font-size: 14px; }
  .general { margin-top: 14px; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--muted); font-size: 14px; color: var(--muted); }
  .general p { margin: 6px 0 0; color: var(--text); }
  .problems { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-size: 14px; }
  .ok { margin-top: 14px; font-size: 13px; color: var(--good); }
  .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; transition: box-shadow .2s; }
  .card.unused { opacity: .6; }
  .card.flash { box-shadow: 0 0 0 3px var(--accent); }
  .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card-name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .bar { height: 4px; border-radius: 2px; background: var(--border); margin: 8px 0; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .desc { font-size: 13px; margin-top: 6px; }
  .kind { font-weight: 600; }
  .kind.document { color: var(--good); }
  .kind.notes { color: var(--warn); }
  details.desc summary { cursor: pointer; list-style: none; }
  details.desc p { white-space: pre-wrap; margin: 8px 0 0; }
  .footer { margin-top: 14px; color: var(--muted); font-size: 12px; }
  .status { color: var(--muted); }
  .error { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>rag-motion</h1>
  <p class="sub">Answers built from your guideline documents, coaching notes, and exercise catalog, with every source shown. Local prototype.</p>

  <form id="ask-form">
    <input id="q" type="text" placeholder="Ask about exercises, e.g. beginner lower-body exercises with dumbbells" autocomplete="off" required minlength="3" maxlength="500">
    <button id="ask-btn" type="submit">Ask</button>
  </form>
  <div class="examples" id="examples"></div>

  <div id="out"></div>
</main>

<script>
const EXAMPLES = [
  "How much strength training should a beginner adult do each week, and which exercises?",
  "How heavy should older adults lift to build strength?",
  "I'm a beginner with dumbbells and bands. Good lower-body exercises?",
  "explosive exercises to help me run faster",
  "what exercises can I do for biceps",
  "exercises that need no equipment",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

for (const ex of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = ex;
  b.onclick = () => { $("q").value = ex; ask(ex); };
  $("examples").appendChild(b);
}
$("ask-form").onsubmit = (e) => { e.preventDefault(); ask($("q").value.trim()); };

function renderAnswer(text) {
  // Escape first, then add light formatting and clickable [slug] citations.
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([a-z0-9]+(?:-[a-z0-9]+)*(?:\s*,\s*[a-z0-9]+(?:-[a-z0-9]+)*)*)\]/g, (_, group) =>
      group.split(",").map(id => `<a class="cite" data-id="${id.trim()}">${id.trim()}</a>`).join(" "));
}

function bar(sim) {
  return `<div class="bar"><div style="width:${Math.max(0, Math.min(1, sim)) * 100}%"></div></div>`;
}
function badge(cited) {
  return `<span class="badge ${cited ? "full" : "none"}">${cited ? "cited" : "not used"}</span>`;
}
function exerciseCard(h) {
  return `<div class="card ${h.cited ? "" : "unused"}" id="card-${esc(h.id)}">
    <div class="card-top"><span class="card-name">${esc(h.name)}</span>${badge(h.cited)}</div>
    ${bar(h.similarity)}
    <div class="meta">similarity ${h.similarity.toFixed(3)} · ${esc(h.movement_pattern)} · ${esc(h.difficulty)} · ${esc(h.equipment.join(", "))}</div>
    <div class="desc">${esc(h.description)}</div>
    <div class="meta" style="margin-top:6px">Exercise catalog [${esc(h.id)}] · ${esc(h.source)}</div>
  </div>`;
}
function passageCard(p) {
  const kind = p.source_type === "document" ? "document" : "notes";
  const where = p.page_start ? `pages ${p.page_start}–${p.page_end}` : "project notes";
  const section = (p.headings && p.headings.length) ? p.headings.join("; ") : p.chapter;
  const snippet = p.text.replace(/^## .*$/gm, "").trim();
  return `<div class="card ${p.cited ? "" : "unused"}" id="card-${esc(p.id)}">
    <div class="card-top"><span class="card-name">${esc(section)}</span>${badge(p.cited)}</div>
    ${bar(p.similarity)}
    <div class="meta">similarity ${p.similarity.toFixed(3)} · <span class="kind ${kind}">${kind}</span> · ${esc(where)}</div>
    <details class="desc"><summary>${esc(snippet.slice(0, 180))}${snippet.length > 180 ? "…" : ""}</summary><p>${esc(snippet)}</p></details>
    <div class="meta" style="margin-top:6px">${esc(p.source_title)} · ${esc(p.chapter)} [${esc(p.id)}]</div>
  </div>`;
}

async function ask(question) {
  if (question.length < 3) return;
  $("ask-btn").disabled = true;
  $("out").innerHTML = `<p class="status">Searching the database, then writing a grounded answer. Usually 5 to 20 seconds…</p>`;
  try {
    const res = await fetch("/api/ask", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, k: 5}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : res.statusText);

    const t = data.timings_ms, u = data.usage;
    const cost = u.cost_usd == null ? "cost not reported" : `$${u.cost_usd.toFixed(6)}`;
    const checks = data.citation_problems.length
      ? `<div class="problems"><strong>Citation problems (checked in code):</strong><br>${data.citation_problems.map(esc).join("<br>")}</div>`
      : `<div class="ok">✓ Every citation points to retrieved evidence (checked in code, not by the LLM).</div>`;

    $("out").innerHTML = `
      <div class="grid">
        <section class="panel">
          <h2>Answer</h2>
          <span class="badge ${esc(data.evidence_coverage)}">evidence coverage: ${esc(data.evidence_coverage)}</span>
          <div class="answer">${renderAnswer(data.answer)}</div>
          ${data.gaps ? `<div class="gaps"><strong>What the evidence doesn't cover:</strong> ${esc(data.gaps)}</div>` : ""}
          ${data.general_guidance ? `<div class="general"><strong>General guidance: not from your sources.</strong> From the model's general training knowledge, not verified against your database.<p>${esc(data.general_guidance)}</p></div>` : ""}
          ${checks}
          <div class="footer">retrieval ${t.retrieval} ms · generation ${t.generation} ms · ${esc(u.model)} · ${u.prompt_tokens} in / ${u.completion_tokens} out tokens · ${cost}</div>
        </section>
        <section class="panel">
          <h2>Document passages (${data.passages.length})</h2>
          ${data.passages.map(passageCard).join("")}
          <h2 style="margin-top:18px">Exercises (${data.exercises.length})</h2>
          ${data.exercises.map(exerciseCard).join("")}
        </section>
      </div>`;

    document.querySelectorAll(".cite").forEach(a => a.onclick = () => {
      const el = document.getElementById("card-" + a.dataset.id);
      if (!el) return;
      el.scrollIntoView({behavior: "smooth", block: "center"});
      el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
    });
  } catch (err) {
    $("out").innerHTML = `<p class="error">Something went wrong: ${esc(err.message)}</p>`;
  } finally {
    $("ask-btn").disabled = false;
  }
}
</script>
</body>
</html>
