[project]
name = "ragmotion"
version = "0.1.0"
description = "AI-native movement and exercise programming: RAG over an exercise knowledge base"
readme = "README.md"
authors = [
    { name = "Musab Saraswat", email = "musab.work17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "voyageai>=0.5.0",
]

[project.scripts]
ragmotion = "ragmotion:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
