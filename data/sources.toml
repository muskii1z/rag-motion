# Source manifest: every external document the knowledge base ingests.
#
# This file is committed; the documents themselves are downloaded into data/raw/ (git-ignored).
# Licensing policy: docs/decisions/0017-knowledge-source-licensing-policy.md
#   group A = public domain / OGL / CC BY: ingest and commit processed text with attribution
#   group B = NC or share-alike: ingest with per-chunk license tags
#   group C = no-derivatives: local only or skip
#   group D = all rights reserved: never ingested; original notes only
#
# sha256 pins the exact file we processed, so a changed upstream file is detected.

