# rag-motion evaluation set (Step 15)
#
# STATUS: expected answers DRAFTED BY CLAUDE, pending review by the coach (M. Saraswat).
# v2 (after adding the Kons 2023 plyometrics and Haugen 2019 sprint papers): sprint is no longer a gap,
# plyometric/explosive questions accept the new papers as evidence, and two research questions were added.
# Scores are provisional until each question's `reviewed` is set to true.
#
# Fields
#   question            what a coach might ask
#   category            exercise-selection | jargon | constraint | dose | population | notes | coverage-gap
#   expected_exercises  catalog slugs that SHOULD be retrieved (order doesn't matter)
#   forbidden_exercises slugs that must NOT be recommended (e.g. need equipment the client lacks)
#   acceptable_exercises slugs that are fine to mention IF the answer labels them (secondary muscle,
#                       intermediate for a beginner); neither required nor penalized in scoring
#   expected_passages   matchers; a retrieved passage matches if `source` is equal AND (any of its pages
#                       is in `pages`, OR a heading contains `heading`, OR its chapter starts with `chapter`).
#                       A matcher with only `source` matches any passage from that source.
#   forbidden_passages  same matcher format; retrieving/citing these means the wrong population or source
#   expected_coverage   what an honest answer should claim: full | partial | none
#
# Matching by source + page/heading (not chunk number) keeps expectations valid after re-chunking.

questions:

# ---- Choosing exercises from the catalog ----
- id: ex-glutes-dumbbells
  question: "Beginner glute exercises using dumbbells"
  category: exercise-selection
  expected_exercises: [dumbbell-hip-thrust, dumbbell-romanian-deadlift, dumbbell-reverse-lunge, goblet-squat, dumbbell-step-up]
  acceptable_exercises: [bulgarian-split-squat, single-leg-romanian-deadlift]  # only if labeled intermediate
  expected_coverage: full
  reviewed: true
  notes: >-
    Coach review (M. Saraswat): the question says "beginner", so only beginner exercises are expected.
    Removed bulgarian-split-squat (intermediate); single-leg-romanian-deadlift stays out for the same reason.
    Added dumbbell-step-up after checking the full catalog: beginner, dumbbell (plus a box, like the hip
    thrust's bench), glutes. Farmer carry lists glutes but isn't a glute exercise, so it's not expected.
    Answer-level rule, not yet checked by code: if an answer suggests an intermediate exercise to a
    beginner, it must say the exercise is intermediate.

- id: ex-band-pull
  question: "Upper-body pulling exercises with resistance bands"
  category: exercise-selection
  expected_exercises: [band-pull-apart]
  expected_coverage: partial  # only one band pull exists in the catalog
  reviewed: true

- id: ex-unilateral-lower
  question: "Unilateral lower-body exercises"
  category: exercise-selection
  expected_exercises: [bulgarian-split-squat, dumbbell-reverse-lunge, dumbbell-step-up, single-leg-romanian-deadlift, lateral-bound]
  expected_coverage: full
  reviewed: true

- id: ex-explosive-speed
  question: "Explosive exercises to help me run faster"
  category: exercise-selection
  expected_exercises: [broad-jump, box-jump, lateral-bound, kettlebell-swing]
  expected_passages: [{source: haugen2019-sprint}, {source: kons2023-plyo}]
  expected_coverage: full  # v2: the sprint and plyometric papers now supply the principles
  reviewed: true

- id: ex-biceps
  question: "What exercises can I do for biceps?"
  category: exercise-selection
  expected_exercises: [one-arm-dumbbell-row, inverted-row]
  expected_coverage: partial  # no curls in the catalog
  reviewed: true
  notes: >-
    Coach review (M. Saraswat): rows are acceptable answers, but only as secondary biceps work.
    Answer-level rule, not yet checked by code: the answer must say explicitly that the biceps are
    trained as a secondary muscle in these rows (not present them as biceps exercises).

- id: ex-hinge
  question: "Hip hinge exercises"
  category: exercise-selection
  expected_exercises: [dumbbell-romanian-deadlift, single-leg-romanian-deadlift, kettlebell-swing, dumbbell-hip-thrust, glute-bridge]
  expected_coverage: full
  reviewed: true

- id: ex-anti-rotation
  question: "Anti-rotation core exercise"
  category: exercise-selection
  expected_exercises: [pallof-press]
  expected_coverage: full
  reviewed: true
  notes: "Coach review: Pallof press only. The dead bug is anti-extension, not anti-rotation."

- id: ex-grip
  question: "Something to build grip strength"
  category: exercise-selection
  expected_exercises: [farmer-carry]
  acceptable_exercises: [one-arm-dumbbell-row, inverted-row, dumbbell-romanian-deadlift, kettlebell-swing]
  expected_coverage: full
  reviewed: true
  notes: >-
    Coach review: the farmer carry is the grip exercise. Rows, RDLs, and swings may be mentioned only if
    the answer says grip is trained secondarily (same rule as ex-biceps).

- id: ex-overhead
  question: "Overhead pressing exercise for the shoulders"
  category: exercise-selection
  expected_exercises: [dumbbell-overhead-press]
  expected_coverage: full
  reviewed: true
  notes: "Coach review: overhead press only; the push-up is a horizontal press."

- id: ex-upper-back
  question: "Exercises for the upper back and rear shoulders"
  category: exercise-selection
  expected_exercises: [band-pull-apart, one-arm-dumbbell-row, inverted-row, farmer-carry]
  expected_coverage: full
  reviewed: true
  notes: "Coach review: added the farmer carry (upper trapezius) to the three pulls."

# ---- Coach jargon and abbreviations ----
- id: jargon-rdl
  question: "beginner RDL"
  category: jargon
  expected_exercises: [dumbbell-romanian-deadlift]
