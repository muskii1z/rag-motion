  expected_coverage: full
  reviewed: true
  notes: >-
    Coach review: the question says beginner, so only the dumbbell RDL is expected. The single-leg RDL
    may be shown only if the answer labels it intermediate.

- id: jargon-bss
  question: "BSS for single-leg strength"
  category: jargon
  expected_exercises: [bulgarian-split-squat]
  expected_coverage: full
  reviewed: true
  notes: "Coach review: the question names one exercise, so only the BSS is expected; alternatives aren't required."

- id: jargon-kb
  question: "KB exercise for hip power"
  category: jargon
  expected_exercises: [kettlebell-swing]
  expected_coverage: full
  reviewed: true

# ---- Hard constraints (what the client owns) ----
- id: constraint-no-equipment
  question: "Exercises that need no equipment"
  category: constraint
  expected_exercises: [push-up, dead-bug, glute-bridge, broad-jump, lateral-bound]
  forbidden_exercises: [band-pull-apart, box-jump, bulgarian-split-squat, dumbbell-hip-thrust, dumbbell-overhead-press,
                        dumbbell-reverse-lunge, dumbbell-romanian-deadlift, dumbbell-step-up, farmer-carry, goblet-squat,
                        inverted-row, kettlebell-swing, one-arm-dumbbell-row, pallof-press, single-leg-romanian-deadlift]
  expected_coverage: full
  reviewed: true
  notes: "Coach review: every exercise that needs any equipment is forbidden (all 15 non-bodyweight exercises)."

- id: constraint-dumbbells-only
  question: "I only have a pair of dumbbells. Good lower-body exercises?"
  category: constraint
  expected_exercises: [goblet-squat, dumbbell-romanian-deadlift, dumbbell-reverse-lunge, single-leg-romanian-deadlift,
                       glute-bridge, broad-jump, lateral-bound]
  forbidden_exercises: [dumbbell-step-up, dumbbell-hip-thrust, bulgarian-split-squat, box-jump, kettlebell-swing]  # need a box, bench, or kettlebell
  expected_coverage: full
  reviewed: true
  notes: >-
    Coach review: list the dumbbell exercises, and also the bodyweight ones, since they need nothing.
    Answer-level rule: the answer should say the bodyweight ones need no equipment. Note: 7 expected
    exercises vs a top-5 search means the best possible recall here is 5/7 (0.71).

